name: Validate OCS Industry Copy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint src/components/ocs/OcsIndustryCopyEnhancements.tsx src/pages/OcsBillingHubPage.tsx
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
