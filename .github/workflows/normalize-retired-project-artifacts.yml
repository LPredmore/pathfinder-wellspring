name: Normalize retired project artifacts

on:
  push:
    branches:
      - agent/scan-all-files-for-retired-project-name

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scan-all-files-for-retired-project-name
          fetch-depth: 0
      - name: Normalize committed artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          doc = Path('docs/pre-change-interest-audit-2026-07-17.md')
          text = doc.read_text()
          text = text.replace(
              '3. Therapist CRM Supabase (legacy / earlier implementation)',
              '3. Retired standalone relationship-system database (legacy / earlier implementation)',
          )
          doc.write_text(text)

          types = Path('src/integrations/supabase/types.ts')
          text = types.read_text()
          text, count = re.subn(
              r'\n      import_therapist_crm_[A-Za-z0-9_]+: \{\n(?:.*\n)*?      \}\n',
              '\n',
              text,
          )
          if count == 0:
              raise SystemExit('Expected at least one stale retired-project RPC declaration in generated types')
          types.write_text(text)
          PY
      - name: Commit normalized files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/pre-change-interest-audit-2026-07-17.md src/integrations/supabase/types.ts
          git diff --cached --quiet && exit 0
          git commit -m 'chore: remove final retired project references'
          git push origin HEAD:agent/scan-all-files-for-retired-project-name
