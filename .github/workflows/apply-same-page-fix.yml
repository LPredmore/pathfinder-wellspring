name: Apply Same Page Fix

on:
  push:
    branches:
      - agent/fix-same-page-scroll-alignment

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-same-page-scroll-alignment
          fetch-depth: 0
      - name: Apply verified source patch
        run: |
          git apply --check .github/same-page-fix.patch
          git apply .github/same-page-fix.patch
          git diff --check
          rm .github/same-page-fix.patch
          rm -f .github/pr-trigger-note.txt .github/pr-description.md .github/pr-open-marker.txt
          rm .github/workflows/apply-same-page-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix same-page navigation and form confirmation alignment"
          git push origin HEAD:agent/fix-same-page-scroll-alignment
