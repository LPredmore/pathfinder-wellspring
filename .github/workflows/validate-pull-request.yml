name: Validate Website

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply clinician recruiting rebuild
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          python scripts/rebuild-clinicians-page.py
          npm ci
          npx prettier --write src/pages/Clinicians.tsx src/components/forms/TherapistApplicationForm.tsx src/components/SEO.tsx

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Clinicians.tsx src/components/forms/TherapistApplicationForm.tsx src/components/SEO.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild clinician recruiting page"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
