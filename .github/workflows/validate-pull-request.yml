name: Validate Website

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Reduce BTY refinement to minimal diff
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          git checkout origin/main -- \
            src/pages/BeyondTheYellowPage.tsx \
            src/components/intake/UnifiedBtyForm.tsx \
            src/components/intake/UnifiedBtyForm.test.tsx
          python scripts/apply-bty-guest-refinement.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pages/BeyondTheYellowPage.tsx \
            src/components/intake/UnifiedBtyForm.tsx \
            src/components/intake/UnifiedBtyForm.test.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Reduce BTY guest refinement to minimal diff"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint src/pages/BeyondTheYellowPage.tsx src/components/intake/UnifiedBtyForm.tsx src/components/intake/UnifiedBtyForm.test.tsx
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
