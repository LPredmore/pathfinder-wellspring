name: Validate Partner Donor Journey

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --silent
      - name: Run targeted donor page test
        id: targeted_test
        continue-on-error: true
        run: npm test -- src/pages/Partner.test.tsx --reporter=verbose > partner-test.log 2>&1
      - name: Upload targeted test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partner-test-log
          path: partner-test.log
      - name: Stop after targeted test failure
        if: steps.targeted_test.outcome == 'failure'
        run: exit 1
      - run: npx eslint src/pages/Partner.tsx src/pages/Partner.test.tsx src/App.tsx src/components/layout/Header.tsx src/components/layout/Footer.tsx
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
