name: Apply Billing Hub intake cutover

on:
  push:
    branches:
      - agent/billing-hub-intake-cutover

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/billing-hub-intake-cutover
          fetch-depth: 0

      - name: Apply targeted source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          billing_client = '''import { createClient } from "@supabase/supabase-js";

const BILLING_HUB_URL = "https://ahqauomkgflopxgnlndd.supabase.co";
const BILLING_HUB_PUBLISHABLE_KEY = "sb_publishable_VVcb2HRrfnMm-T1Y0i7Gtw_qLhuPMYT";

/**
 * Dedicated public-intake client.
 *
 * The website's legacy Supabase client remains in place for unrelated media,
 * donation, and portal functionality. Public form submissions use Billing Hub
 * without sharing or persisting the legacy website auth session.
 */
export const billingHubSupabase = createClient(
  BILLING_HUB_URL,
  BILLING_HUB_PUBLISHABLE_KEY,
  {
    auth: {
      persistSession: false,
      autoRefreshToken: false,
      detectSessionInUrl: false,
    },
  },
);
'''
