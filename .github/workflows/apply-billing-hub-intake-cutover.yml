                    onChange={(event) => update("veteran_affiliated", event.target.checked)}
                    className="h-4 w-4 rounded border-input"
                  />
                  Veteran or military-family affiliated
                </label>
              </div>
            </fieldset>
          )}

          {showNominateOrganization && (
            <label className="flex items-center gap-3 rounded-lg border border-border bg-muted/30 p-4 text-sm text-foreground">
              <input
                type="checkbox"
                checked={form.subject_veteran_affiliated}
                onChange={(event) => update("subject_veteran_affiliated", event.target.checked)}
                className="h-4 w-4 rounded border-input"
              />
              The nominated organization is veteran or military-family affiliated
            </label>
          )}

'''
          text = replace_once(text, consent_anchor, classification + consent_anchor, "bty classifications")
          path.write_text(text, encoding="utf-8")

          # Remove this one-time workflow before committing the application changes.
          Path(".github/workflows/apply-billing-hub-intake-cutover.yml").unlink()
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate build
        run: npm run build

      - name: Commit cutover
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integrations/billingHub/client.ts \
                  src/components/forms/TherapistApplicationForm.tsx \
                  src/pages/OperationClaimsSuccessPage.tsx \
                  src/pages/BeyondTheYellowPage.tsx \
                  .github/workflows/apply-billing-hub-intake-cutover.yml
          git commit -m "route website intake to Billing Hub"
          git push origin HEAD:agent/billing-hub-intake-cutover
