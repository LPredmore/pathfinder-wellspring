name: Validate Partner Donation Routing

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint src/components/DonateButton.tsx src/components/DonateButton.test.tsx src/components/layout/Footer.tsx
      - run: npx tsc --noEmit
      - run: npx vitest run src/components/DonateButton.test.tsx src/pages/Partner.test.tsx
      - run: npm test
      - run: npm run build
      - name: Capture literal donate routes
        shell: bash
        run: |
          grep -RIn --exclude-dir=node_modules --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' '/donate' src > donate-route-audit.txt || true
          cat donate-route-audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: donate-route-audit
          path: donate-route-audit.txt
