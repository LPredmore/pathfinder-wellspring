name: Finalize Partner Donation Routing

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Route donation structured data through Partner
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/SEO.tsx")
          text = path.read_text()
          old = "urlTemplate: `${SITE_URL}/donate`"
          new = "urlTemplate: `${SITE_URL}/partner`"
          if old in text:
              path.write_text(text.replace(old, new))
          elif new not in text:
              raise SystemExit("DonateActionSchema target was not found")
          PY
      - run: npm ci
      - run: npx eslint src/components/DonateButton.tsx src/components/DonateButton.test.tsx src/components/layout/Footer.tsx src/pages/Support.tsx src/pages/Partner.test.tsx src/components/SEO.tsx
      - run: npx tsc --noEmit
      - run: npx vitest run src/components/DonateButton.test.tsx src/pages/Partner.test.tsx
      - run: npm test
      - run: npm run build
      - name: Audit literal donate routes
        shell: bash
        run: |
          set -euo pipefail
          matches="$(grep -RIn --exclude-dir=node_modules --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' '/donate' src || true)"
          printf '%s\n' "$matches"

          unexpected="$(printf '%s\n' "$matches" | grep -vE 'src/pages/Partner\.tsx|src/pages/Partner\.test\.tsx|src/pages/Donate\.tsx|src/components/DonateButton\.tsx|src/components/DonateButton\.test\.tsx|src/App\.tsx' || true)"

          if [[ -n "$unexpected" ]]; then
            echo 'Unexpected /donate references remain:'
            printf '%s\n' "$unexpected"
            exit 1
          fi
      - name: Commit structured-data correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SEO.tsx
          if git diff --cached --quiet; then
            echo "Structured-data route already correct."
          else
            git commit -m "Route donation structured data through partner page"
            git push
          fi
