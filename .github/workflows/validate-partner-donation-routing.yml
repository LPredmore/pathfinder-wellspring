name: Validate Partner Donation Routing

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint src/components/DonateButton.tsx src/components/DonateButton.test.tsx src/components/layout/Footer.tsx
      - run: npx tsc --noEmit
      - run: npx vitest run src/components/DonateButton.test.tsx src/pages/Partner.test.tsx
      - run: npm test
      - run: npm run build
      - name: Audit literal donate routes
        shell: bash
        run: |
          set -euo pipefail
          matches="$(grep -RIn --exclude-dir=node_modules --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' '/donate' src || true)"
          printf '%s\n' "$matches"

          unexpected="$(printf '%s\n' "$matches" | grep -vE 'src/pages/Partner\.tsx|src/pages/Partner\.test\.tsx|src/pages/Donate\.tsx|src/components/DonateButton\.tsx|src/components/DonateButton\.test\.tsx|src/App\.tsx' || true)"

          if [[ -n "$unexpected" ]]; then
            echo 'Unexpected /donate references remain:'
            printf '%s\n' "$unexpected"
            exit 1
          fi
