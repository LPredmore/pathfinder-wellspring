name: Validate OCS Visuals

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint src/components/ocs/OcsVisualEnhancements.tsx src/components/ocs/OcsVisualEnhancements.test.tsx src/pages/OcsBillingHubPage.tsx
      - run: npx tsc --noEmit
      - run: npx vitest run src/components/ocs/OcsVisualEnhancements.test.tsx
      - name: Run full suite and capture report
        id: full-tests
        continue-on-error: true
        run: npx vitest run --reporter=json --outputFile=vitest-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocs-vitest-results
          path: vitest-results.json
      - run: npm run build
      - name: Fail when full suite failed
        if: steps.full-tests.outcome == 'failure'
        run: exit 1
